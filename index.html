<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Pinball</title>
<style>
  html,body{margin:0;height:100%;background:radial-gradient(ellipse at top,#1d1240,#07070f 70%);color:#e8e8ff;
    font-family:system-ui,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:6px}
  #hud{display:flex;gap:16px;font-weight:700;letter-spacing:.06em;font-size:13px;flex-wrap:wrap;justify-content:center}
  #hud span{opacity:.7}
  #hud b{color:#3df2ff;font-variant-numeric:tabular-nums;margin-left:4px}
  canvas{display:block;border-radius:14px;box-shadow:0 0 40px #ff3df233,0 0 0 2px #ffffff12}
  #help{font-size:11px;opacity:.55;text-align:center;padding:0 16px}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div><span>SCORE</span><b id="score">0</b></div>
    <div><span>BALL</span><b id="balls">3</b></div>
    <div><span>MULT</span><b id="mult">x1</b></div>
    <div><span>HI</span><b id="hi">0</b></div>
  </div>
  <canvas id="c"></canvas>
  <div id="help">플리퍼: ← → (또는 Z, /) · 발사: Space 또는 ↓ 를 누르고 있다가 떼기 · 모바일: 화면 왼쪽/오른쪽 터치</div>
</div>
<script>
(() => {
'use strict';
const W = 400, H = 700, R = 8, G = 950, MAXV = 1800, SUB = 10;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let scale = 1, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const hudH = $('hud').offsetHeight + $('help').offsetHeight + 28;
  scale = Math.min((innerWidth - 16) / W, (innerHeight - hudH) / H);
  cv.style.width = W * scale + 'px';
  cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
}
addEventListener('resize', resize);
resize();

// ---------- sound ----------
let actx;
function beep(f, d = 0.06, type = 'square', vol = 0.04) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * 0.6, t + d);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + d);
  } catch (e) {}
}

// ---------- table ----------
const walls = [];
function wall(x1, y1, x2, y2, o = {}) {
  const w = Object.assign({ x1, y1, x2, y2, e: 0.45, rad: 0, kick: 0, color: '#3df2ff', flash: 0, up: true }, o);
  walls.push(w);
  return w;
}
function poly(pts, o) { for (let i = 0; i < pts.length - 1; i++) wall(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], o); }

const arc = [];
for (let i = 0; i <= 32; i++) {
  const a = -Math.PI * i / 32;
  arc.push([200 + 180 * Math.cos(a), 200 + 180 * Math.sin(a)]);
}
wall(380, 670, 380, 200);
poly(arc);
poly([[20, 200], [20, 500], [100.6, 595.8]]);
poly([[350, 500], [269.4, 595.8]]);
wall(95, 612, 95, 760); // aprons below the flipper pivots
wall(275, 612, 275, 760);
wall(350, 240, 350, 670);
wall(350, 670, 380, 670);
const gate = wall(350, 240, 378, 206, { oneWay: true, color: '#ffd23d' });
// top-left kicker: knocks a ball riding the arc back into the playfield
const arcPt = a => [200 + 180 * Math.cos(a), 200 + 180 * Math.sin(a)];
const [kx1, ky1] = arcPt(-0.66 * Math.PI), [kx2, ky2] = arcPt(-0.9 * Math.PI);
wall(kx1, ky1, kx2, ky2, { kick: 380, e: 0.6, color: '#ffd23d', sound: 760, onHit: w => addScore(10, w) });

// slingshots
const slings = [];
function sling(pts, kickA, kickB) {
  poly([pts[0], pts[1], pts[2]], { color: '#ff3df2' });
  slings.push(wall(pts[kickA][0], pts[kickA][1], pts[kickB][0], pts[kickB][1],
    { kick: 420, e: 0.6, color: '#ff3df2', onHit: w => addScore(10, w), sound: 520 }));
}
sling([[60, 440], [60, 510], [105, 545]], 0, 2);
sling([[310, 440], [310, 510], [265, 545]], 0, 2);

// top rollover lanes
const guideXs = [125, 165, 205, 245];
for (const x of guideXs) wall(x, 70, x, 110, { rad: 3, color: '#b98cff' });
const lanes = [false, false, false];

// drop targets on the right
const drops = [];
for (let i = 0; i < 3; i++) {
  drops.push(wall(345, 300 + i * 32, 345, 326 + i * 32, {
    rad: 3, e: 0.3, color: '#ffd23d', drop: true,
    onHit: w => { w.up = false; addScore(250, w); beep(300, 0.08, 'sawtooth'); checkDrops(); }
  }));
}
let dropReset = 0;
function checkDrops() {
  if (drops.every(d => !d.up)) {
    addScore(5000, { x1: 330, y1: 345 });
    banner('DROP BANK 5000!');
    beep(880, 0.25, 'triangle', 0.06);
    dropReset = 1.2;
  }
}

// bumpers
const bumpers = [
  { x: 135, y: 190, r: 20, flash: 0 },
  { x: 235, y: 190, r: 20, flash: 0 },
  { x: 185, y: 265, r: 20, flash: 0 },
];

// flippers
function flipper(px, py, rest, up) { return { px, py, len: 68, rad: 7, rest, up, a: rest, w: 0, active: false }; }
const fl = flipper(95, 600, 0.5, -0.45);
const fr = flipper(275, 600, Math.PI - 0.5, Math.PI + 0.45);
const flippers = [fl, fr];

// ---------- game state ----------
const LANE_X = 365, LANE_Y = 655;
const ball = { x: LANE_X, y: LANE_Y, vx: 0, vy: 0, live: false };
let trail = [];
let score = 0, ballsLeft = 3, mult = 1, state = 'ready', charge = 0, charging = false;
let hi = 0;
try { hi = +localStorage.getItem('neonPinballHi') || 0; } catch (e) {}
let still = 0, respawn = 0;
const pops = [];
let bannerText = '', bannerT = 0;

function banner(t) { bannerText = t; bannerT = 2; }
function addScore(n, at) {
  const v = n * mult;
  score += v;
  if (at) pops.push({ x: at.x ?? at.x1, y: at.y ?? at.y1, t: 1, text: '+' + v });
}
function inLane() { return ball.x > 350 && ball.y > 240; }

function newGame() {
  score = 0; ballsLeft = 3; mult = 1;
  lanes.fill(false);
  drops.forEach(d => d.up = true);
  resetBall();
}
function resetBall() {
  ball.x = LANE_X; ball.y = LANE_Y; ball.vx = 0; ball.vy = 0; ball.live = true;
  trail = [];
  state = 'ready';
}
function loseBall() {
  ball.live = false;
  ballsLeft--;
  beep(160, 0.4, 'sawtooth', 0.05);
  if (ballsLeft > 0) { banner('BALL LOST'); respawn = 1.2; }
  else {
    state = 'over';
    if (score > hi) { hi = score; try { localStorage.setItem('neonPinballHi', hi); } catch (e) {} banner('NEW HIGH SCORE!'); }
  }
}

// ---------- physics ----------
function closest(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - x1) * dx + (py - y1) * dy) / l2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return [x1 + dx * t, y1 + dy * t];
}
// reflect ball velocity off normal n relative to a moving surface; returns approach speed
function resolve(nx, ny, e, svx = 0, svy = 0) {
  let rvx = ball.vx - svx, rvy = ball.vy - svy;
  const vn = rvx * nx + rvy * ny;
  if (vn < 0) {
    rvx -= (1 + e) * vn * nx; rvy -= (1 + e) * vn * ny;
    ball.vx = rvx + svx; ball.vy = rvy + svy;
  }
  return -vn;
}
function kickOut(nx, ny, k) {
  const vn = ball.vx * nx + ball.vy * ny;
  if (vn < k) { ball.vx += (k - vn) * nx; ball.vy += (k - vn) * ny; }
}

function updateFlipper(f, h) {
  const target = f.active ? f.up : f.rest;
  const diff = target - f.a;
  const step = Math.sign(diff) * Math.min(Math.abs(diff), (f.active ? 24 : 14) * h);
  f.a += step;
  f.w = step / h;
}

function step(h) {
  const py = ball.y;
  ball.vy += G * h;
  const sp = Math.hypot(ball.vx, ball.vy);
  if (sp > MAXV) { ball.vx *= MAXV / sp; ball.vy *= MAXV / sp; }
  ball.x += ball.vx * h;
  ball.y += ball.vy * h;

  for (const w of walls) {
    if (!w.up) continue;
    if (w.oneWay && (w.x2 - w.x1) * (ball.y - w.y1) - (w.y2 - w.y1) * (ball.x - w.x1) >= 0) continue;
    const [cx, cy] = closest(ball.x, ball.y, w.x1, w.y1, w.x2, w.y2);
    let dx = ball.x - cx, dy = ball.y - cy;
    const d = Math.hypot(dx, dy), min = R + w.rad;
    if (d >= min || d === 0) continue;
    const nx = dx / d, ny = dy / d;
    ball.x = cx + nx * min; ball.y = cy + ny * min;
    const imp = resolve(nx, ny, w.e);
    if (w.kick && imp > 40) {
      kickOut(nx, ny, w.kick);
      w.flash = 1;
      beep(w.sound || 400, 0.05);
    }
    if (w.onHit && (w.drop || imp > 40)) w.onHit(w);
  }

  for (const b of bumpers) {
    const dx = ball.x - b.x, dy = ball.y - b.y, d = Math.hypot(dx, dy), min = R + b.r;
    if (d >= min || d === 0) continue;
    const nx = dx / d, ny = dy / d;
    ball.x = b.x + nx * min; ball.y = b.y + ny * min;
    resolve(nx, ny, 0.7);
    kickOut(nx, ny, 480);
    b.flash = 1;
    addScore(100, b);
    beep(660 + Math.random() * 200, 0.07);
  }

  for (const f of flippers) {
    const tx = f.px + Math.cos(f.a) * f.len, ty = f.py + Math.sin(f.a) * f.len;
    const [cx, cy] = closest(ball.x, ball.y, f.px, f.py, tx, ty);
    const dx = ball.x - cx, dy = ball.y - cy, d = Math.hypot(dx, dy), min = R + f.rad;
    if (d >= min || d === 0) continue;
    const nx = dx / d, ny = dy / d;
    ball.x = cx + nx * min; ball.y = cy + ny * min;
    resolve(nx, ny, 0.25, -f.w * (cy - f.py), f.w * (cx - f.px));
  }

  // rollover lanes
  if ((py < 92) !== (ball.y < 92)) {
    for (let i = 0; i < 3; i++) {
      if (ball.x > guideXs[i] && ball.x < guideXs[i + 1] && !lanes[i]) {
        lanes[i] = true;
        addScore(50, { x: (guideXs[i] + guideXs[i + 1]) / 2, y: 92 });
        beep(990, 0.08, 'triangle');
        if (lanes.every(Boolean)) {
          lanes.fill(false);
          if (mult < 5) mult++;
          addScore(1000, { x: 185, y: 130 });
          banner('MULTIPLIER x' + mult + '!');
          beep(1320, 0.3, 'triangle', 0.06);
        }
      }
    }
  }
}

function update(dt) {
  const h = dt / SUB;
  for (let i = 0; i < SUB; i++) {
    flippers.forEach(f => updateFlipper(f, h));
    if (ball.live) step(h);
  }

  if (ball.live) {
    trail.push([ball.x, ball.y]);
    if (trail.length > 10) trail.shift();
    if (state === 'ready' && !inLane()) state = 'play';
    if (ball.y > H + 20) loseBall();
    // anti-stuck nudge
    if (Math.hypot(ball.vx, ball.vy) < 6 && !inLane() && ball.y < 540) {
      still += dt;
      if (still > 2.5) { ball.vy = -350; ball.vx = (Math.random() - 0.5) * 300; still = 0; }
    } else still = 0;
  }
  if (charging && inLane()) charge = Math.min(1, charge + dt);

  if (respawn > 0 && (respawn -= dt) <= 0) resetBall();
  if (dropReset > 0 && (dropReset -= dt) <= 0) drops.forEach(d => d.up = true);
  bumpers.forEach(b => b.flash = Math.max(0, b.flash - dt * 4));
  walls.forEach(w => w.flash = Math.max(0, w.flash - dt * 4));
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].t -= dt; pops[i].y -= dt * 30; if (pops[i].t <= 0) pops.splice(i, 1); }
  bannerT = Math.max(0, bannerT - dt);
}

function launch() {
  if (ball.live && inLane() && ball.y > 640 && Math.abs(ball.vy) < 60 && charge > 0.05) {
    ball.vy = -(950 + 850 * charge);
    beep(220 + charge * 400, 0.15, 'triangle', 0.05);
  }
  charge = 0;
  charging = false;
}

// ---------- input ----------
function setFlipper(f, on) {
  if (on && !f.active) {
    beep(f === fl ? 180 : 200, 0.04, 'square', 0.03);
    // rotate lit lanes with the flippers
    if (f === fl) lanes.push(lanes.shift()); else lanes.unshift(lanes.pop());
  }
  f.active = on;
}
const LEFT = ['ArrowLeft', 'KeyZ', 'ShiftLeft'], RIGHT = ['ArrowRight', 'Slash', 'ShiftRight'], PLUNGE = ['Space', 'ArrowDown'];
addEventListener('keydown', e => {
  if ([...LEFT, ...RIGHT, ...PLUNGE, 'Enter'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (state === 'over') { if (PLUNGE.includes(e.code) || e.code === 'Enter') newGame(); return; }
  if (LEFT.includes(e.code)) setFlipper(fl, true);
  if (RIGHT.includes(e.code)) setFlipper(fr, true);
  if (PLUNGE.includes(e.code)) charging = true;
});
addEventListener('keyup', e => {
  if (LEFT.includes(e.code)) setFlipper(fl, false);
  if (RIGHT.includes(e.code)) setFlipper(fr, false);
  if (PLUNGE.includes(e.code) && charging) launch();
});
const touches = new Map();
addEventListener('pointerdown', e => {
  if (state === 'over') { newGame(); return; }
  let role;
  if (e.clientX < innerWidth / 2) { role = 'L'; setFlipper(fl, true); }
  else if (inLane() && ball.live) { role = 'P'; charging = true; }
  else { role = 'R'; setFlipper(fr, true); }
  touches.set(e.pointerId, role);
});
function pointerEnd(e) {
  const role = touches.get(e.pointerId);
  touches.delete(e.pointerId);
  if (role === 'L' && ![...touches.values()].includes('L')) setFlipper(fl, false);
  if (role === 'R' && ![...touches.values()].includes('R')) setFlipper(fr, false);
  if (role === 'P') launch();
}
addEventListener('pointerup', pointerEnd);
addEventListener('pointercancel', pointerEnd);
addEventListener('contextmenu', e => e.preventDefault());

// ---------- render ----------
function glowLine(x1, y1, x2, y2, color, width) {
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.shadowColor = color; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

function draw() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  // playfield
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#140c2e'); bg.addColorStop(1, '#05050c');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#ffffff08'; ctx.lineWidth = 1; ctx.shadowBlur = 0;
  for (let x = 0; x < W; x += 25) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 25) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  ctx.lineCap = 'round';
  // walls
  for (const w of walls) {
    if (w.drop) continue;
    const c = w.flash > 0 ? '#ffffff' : w.color;
    glowLine(w.x1, w.y1, w.x2, w.y2, c, w.rad ? w.rad * 2 : (w.kick ? 4 : 3));
  }
  // drop targets
  for (const d of drops) {
    if (d.up) glowLine(d.x1, d.y1, d.x2, d.y2, d.color, 7);
    else { ctx.shadowBlur = 0; ctx.strokeStyle = '#ffd23d33'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(d.x1, d.y1); ctx.lineTo(d.x2, d.y2); ctx.stroke(); }
  }
  // rollover lights
  for (let i = 0; i < 3; i++) {
    const x = (guideXs[i] + guideXs[i + 1]) / 2;
    ctx.shadowBlur = lanes[i] ? 16 : 0; ctx.shadowColor = '#3dff8c';
    ctx.fillStyle = lanes[i] ? '#3dff8c' : '#3dff8c30';
    ctx.beginPath(); ctx.arc(x, 92, 6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffffff55'; ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center';
  ctx.fillText('x' + mult, 185, 135);

  // bumpers
  for (const b of bumpers) {
    const g = ctx.createRadialGradient(b.x - 5, b.y - 5, 2, b.x, b.y, b.r);
    g.addColorStop(0, b.flash > 0 ? '#ffffff' : '#ff9cf8');
    g.addColorStop(1, b.flash > 0 ? '#ff3df2' : '#7a0f74');
    ctx.fillStyle = g; ctx.shadowColor = '#ff3df2'; ctx.shadowBlur = 10 + b.flash * 25;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3df2ff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 6, 0, Math.PI * 2); ctx.stroke();
  }

  // flippers
  for (const f of flippers) {
    const tx = f.px + Math.cos(f.a) * f.len, ty = f.py + Math.sin(f.a) * f.len;
    glowLine(f.px, f.py, tx, ty, '#ff3df2', f.rad * 2);
    ctx.shadowBlur = 0; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(f.px, f.py, 3, 0, Math.PI * 2); ctx.fill();
  }

  // plunger
  const pz = charge * 28;
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffd23d';
  ctx.fillRect(356, 672 + pz, 18, 6);
  ctx.strokeStyle = '#ffd23d88'; ctx.lineWidth = 2; ctx.beginPath();
  for (let i = 0; i <= 8; i++) ctx.lineTo(i % 2 ? 360 : 370, 678 + pz + i * ((H - 678 - pz) / 8));
  ctx.stroke();

  // ball
  if (ball.live) {
    trail.forEach(([x, y], i) => {
      ctx.fillStyle = `rgba(61,242,255,${i / trail.length * 0.25})`;
      ctx.beginPath(); ctx.arc(x, y, R * i / trail.length, 0, Math.PI * 2); ctx.fill();
    });
    const g = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 1, ball.x, ball.y, R);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#8a9bb5');
    ctx.fillStyle = g; ctx.shadowColor = '#fff'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, R, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // score pops
  ctx.font = 'bold 12px system-ui';
  for (const p of pops) { ctx.fillStyle = `rgba(255,210,61,${p.t})`; ctx.fillText(p.text, p.x, p.y); }

  // banners / overlays
  ctx.textAlign = 'center';
  if (bannerT > 0) {
    ctx.globalAlpha = Math.min(1, bannerT * 2);
    ctx.font = 'bold 24px system-ui'; ctx.fillStyle = '#3df2ff'; ctx.shadowColor = '#3df2ff'; ctx.shadowBlur = 20;
    ctx.fillText(bannerText, 185, 400);
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }
  if (state === 'ready' && ball.live && charge === 0) {
    ctx.font = 'bold 13px system-ui'; ctx.fillStyle = '#ffffffaa';
    ctx.fillText('SPACE / 오른쪽 터치를 눌렀다 떼서 발사', 185, 410);
  }
  if (state === 'over') {
    ctx.fillStyle = '#000000b0'; ctx.fillRect(0, 0, W, H);
    ctx.font = 'bold 40px system-ui'; ctx.fillStyle = '#ff3df2'; ctx.shadowColor = '#ff3df2'; ctx.shadowBlur = 25;
    ctx.fillText('GAME OVER', W / 2, 300);
    ctx.shadowBlur = 0; ctx.font = 'bold 20px system-ui'; ctx.fillStyle = '#fff';
    ctx.fillText('SCORE ' + score.toLocaleString(), W / 2, 350);
    ctx.font = '14px system-ui'; ctx.fillStyle = '#ffffffaa';
    ctx.fillText('SPACE 또는 터치로 다시 시작', W / 2, 400);
  }

  $('score').textContent = score.toLocaleString();
  $('balls').textContent = Math.max(ballsLeft, 0);
  $('mult').textContent = 'x' + mult;
  $('hi').textContent = Math.max(hi, score).toLocaleString();
}

let last = performance.now();
function frame(t) {
  const dt = Math.min((t - last) / 1000, 1 / 30);
  last = t;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
newGame();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
